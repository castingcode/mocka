name: Test

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - v*
    branches:
      - main

jobs:
  task-test:
    name: Run Task Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Task Test
        run: task test-cover
        
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  postman:
    name: Run Postman Collections
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start mockasrv
        run: |
          go build -o mockasrv ./cmd/mockasrv
          ./mockasrv -folder examples/postman/responses > mockasrv.log 2>&1 &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:4500/_mocka/requests

      # The admin collection checks the request log the MOCA collection fills,
      # so the order matters.
      - name: Run MOCA collection
        run: npx --yes newman@6 run examples/postman/mocka.postman_collection.json

      - name: Run admin collection
        run: npx --yes newman@6 run examples/postman/mocka-admin.postman_collection.json

      - name: Show mockasrv log
        if: failure()
        run: cat mockasrv.log

  ui:
    name: Run UI Browser Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.js builds mockasrv and serves a temporary copy of
      # the Postman example responses.
      - name: Run UI tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
